<section class="card" aria-labelledby="titulo-autenticacao">
  <h1 id="titulo-autenticacao">Login</h1>

  <form (submit)="realizarLogin($event)">
    <div class="campo">
      <label for="nome-usuario">Nome de usuário</label>
      <input
        id="nome-usuario"
        name="nomeUsuario"
        type="text"
        autocomplete="off"
        [value]="nomeUsuario()"
        (input)="atualizarNomeUsuario($event)"
        required
      />
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <input
        id="senha"
        name="senha"
        type="password"
        autocomplete="off"
        [value]="senha()"
        (input)="atualizarSenha($event)"
        required
      />
    </div>

    <button type="submit" [disabled]="!nomeUsuario() || !senha()">Entrar</button>
  </form>

  <p
    class="estado"
    [class.logado]="usuarioLogado()"
    [class.deslogado]="!usuarioLogado()"
    role="status"
  >
    {{ usuarioLogado() ? 'O usuário está logado' : 'O usuário não está logado' }}
  </p>

  @if (loginInvalido()) {
    <p class="erro" role="alert">Nome de usuário ou senha incorretos.</p>
  }

  <p class="dica">
    Credenciais de demonstração: <strong>admin</strong> / <strong>senai123</strong>
  </p>
</section>
