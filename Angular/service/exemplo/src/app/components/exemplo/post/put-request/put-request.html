<form (submit)="cadastrarPut($event)">

    <input type="text" inputmode="numeric" [formField]="putForm.userId" placeholder="UserId">
    <input type="text" [formField]="putForm.title" placeholder="Title">
    <input type="text" [formField]="putForm.body" placeholder="Body">

    <button>Put</button>

</form>
