<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="imagens/logo-cine-house-sem-fundo.png">
    <link rel="stylesheet" href="filme.css">
    <title>Cine House</title>
</head>

<body>
    <header>
        <img class="logo" src="imagens/logo-cine-house-sem-fundo.png" alt="Logo Cine House">
        <h1>Cine House</h1>
    </header>

<main class="hero">
    <form id="formFilme">
        <h2>Cadastro de Filmes</h2>
        <label for="nomeFilme">Nome do Filme:</label>
        <input type="text" id="nomeFilme" placeholder="Digite o nome do filme" required>
        <br>
        <label for="generoFilme">Gênero:</label>
        <input type="text" id="generoFilme" placeholder="Digite o gênero do filme" required>
        <br>
        <label for="anoFilme">Ano de Lançamento:</label>
        <input type="number" id="anoFilme" placeholder="Digite o ano de lançamento" required>
        <br>
        <button type="submit" id="botaoCadastrarFilme">Cadastrar Filme</button>
    </form>
    <div id="listaFilme">
        <h2 class="text">Lista de Filmes <span id="contadorFilmes">0 filmes</span></h2>
    </div>

</main>

<footer>
    <h3>@Locadora</h3>
</footer>

    <script src="filme.js"></script>
</body>
</html>
